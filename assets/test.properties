# ==========================================
# PROPERTIES TEST CASE FILE
# ==========================================

# 1. Basic Key-Value Pairs
simple.key=Simple Value
simple.colon:Value with Colon Separation
simple.space = Value with surrounding spaces

# 2. Hierarchical Structure (Unflatten Test)
app.server.host=localhost
app.server.port=8080
app.database.client.timeout=5000
app.database.client.retry=true

# 3. Line Continuation (Multiline Values)
# These lines should be merged into a single string.
message.welcome = Welcome to \
                  the advanced properties \
                  parser test suite.

# 4. Escaping Characters
# Testing literal dots, equals, colons, and spaces within the key
key\.with\.dots = This key has literal dots
key\=with\=equals = This key has literal equals sign
key\:with\:colon = This key has literal colon
key\ with\ spaces = This key has literal spaces

# 5. Unicode and Special Sequences
# \u00A9 = ©, \u011F = ğ, \u0009 = Tab
unicode.copyright = Copyright \u00A9 2026
unicode.turkish = Hello, d\u011F\u0131nız
unicode.tab = Tab\u0009Character

# 6. Special Characters in Values (No escaping required here)
value.special = URL: http://localhost:3000?query=test&sort=asc

# 7. Empty Values and Comment Varieties
empty.key = 
! This is also a valid comment line (Exclamation mark)
   # Indented comment line

# 8. Numeric and Boolean Values (Tests for auto-typing if implemented)
data.count = 42
data.pi = 3.14159
data.active = true
data.passive = false

# 9. Hierarchical Conflict (Edge Case)
# Test how the parser handles when a key is both a parent and a value
column.nested.value = Nested Value
column.nested = Potential overwrite test

# 10. Paths and Backslashes
# Windows paths often require double backslashes
path.windows = C:\\Users\\Admin\\Documents
path.unix = /usr/local/bin